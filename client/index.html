<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexora — project management for growing teams." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nexora</title>
    <script>
      // Apply the saved theme before first paint, so dark-mode users never see a white flash.
      // Must match next-themes (storageKey "theme", attribute "class").
      try {
        const saved = localStorage.getItem("theme");
        const dark =
          saved === "dark" ||
          ((!saved || saved === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {
        // Storage blocked: fall back to light; next-themes corrects it after load.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
