name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs on the same pull request; never cancel a run on main (it may be deploying).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Runs only for pushes to main, and only if every check above passed (DEP-6).
  deploy:
    name: Deploy to production
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production has autoIndex disabled; indexes are synced explicitly (DEP-9).
      - name: Sync database indexes
        run: npm run db:sync-indexes
        env:
          NODE_ENV: production
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          APP_URL: https://nexora-six-rouge.vercel.app
          # Not used by the script, but required by env validation.
          JWT_ACCESS_SECRET: ci-placeholder-secret-not-used-for-signing
          EMAIL_TRANSPORT: smtp
          SMTP_HOST: placeholder.invalid
          SMTP_USER: placeholder
          SMTP_PASS: placeholder

      - name: Deploy API (Render)
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Deploy client (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      # The deploy hook only *requests* a deploy. If the new version fails to start
      # (e.g. env validation), Render keeps serving the old one and nothing fails.
      # So wait until production reports this exact commit, through the Vercel proxy.
      - name: Verify API deployment
        run: |
          url="https://nexora-six-rouge.vercel.app/api/v1/health"
          for attempt in $(seq 1 40); do
            version=$(curl --silent --max-time 10 "$url" | jq -r '.data.version // empty' || true)
            echo "Attempt $attempt: production reports '${version:-unreachable}', expecting $GITHUB_SHA"
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "Production is running $GITHUB_SHA"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Production did not start $GITHUB_SHA within 10 minutes. Check the Render logs (failed build or env validation)."
          exit 1
